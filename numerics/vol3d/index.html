<!doctype html>
<!-- live PDE surrogate demo page; served by server.py or from the jakobzech.com site (window.NS2D_API = API origin) -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D diffusion, live</title>
<style>
  :root { --bg: #fafafa; --fg: #222; --muted: #666; --accent: #1f5fbf; }
  body { margin: 0 auto; padding: 16px; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 1150px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 240px 1fr; gap: 20px; } @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .knob { margin: 8px 0; } .knob label { display: flex; justify-content: space-between; font-size: 0.9rem; } input[type=range] { width: 100%; }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .panel { text-align: center; font-size: 0.85rem; color: var(--muted); }
  canvas { width: 100%; image-rendering: pixelated; border: 1px solid #ddd; background: #fff; display: block; }
  .stat { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--muted); margin-top: 10px; white-space: pre-line; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 6px; cursor: pointer; margin: 2px 0; }
  button:hover { background: #eef3fb; } .note { font-size: 0.85rem; color: var(--muted); margin-top: 14px; } a { color: var(--accent); }
  h3 { font-size: 0.95rem; margin: 14px 0 4px; color: var(--muted); }
</style>
</head>
<body>
<h1>3D diffusion, rendered live by a surrogate</h1>
<p class="sub">A 64&sup3; parametric diffusion problem. Each slider move takes tens of milliseconds on a CPU; the full solve takes about a second. <a href="../">All demos</a></p>
<div class="grid">
  <div>
    <div id="knobs"></div>
    <div class="knob"><label><span>refinement steps</span><span id="pv">0</span></label><input id="pcg" type="range" min="0" max="4" value="0"></div>
    <button id="zero">reset</button> <button id="rand">random</button> <button id="ref">compare with the full solver</button>
    <div class="stat" id="stat">waiting for the server&hellip;</div>
    <p class="note" id="cell"></p>
  </div>
  <div>
    <h3>log-coefficient a, slices through the volume</h3>
    <div class="panels">
      <div class="panel"><canvas id="a0"></canvas>y<sub>1</sub> = <span id="s0v"></span></div>
      <div class="panel"><canvas id="a1"></canvas>y<sub>2</sub> = <span id="s1v"></span></div>
      <div class="panel"><canvas id="a2"></canvas>y<sub>3</sub> = <span id="s2v"></span></div>
    </div>
    <h3 id="ut">solution u</h3>
    <div class="panels">
      <div class="panel"><canvas id="u0"></canvas><input id="s0" type="range" min="0" max="63" value="32"></div>
      <div class="panel"><canvas id="u1"></canvas><input id="s1" type="range" min="0" max="63" value="32"></div>
      <div class="panel"><canvas id="u2"></canvas><input id="s2" type="range" min="0" max="63" value="32"></div>
    </div>
  </div>
</div>
<script>window.NS2D_API = "https://numerics.strukturbruch.com";</script>
<script>
const API = (window.NS2D_API || "");
let info = null, N = 64, busy = false, pending = false, A = null, U = null, R = null, showRef = false;
const $ = id => document.getElementById(id);
function viridis(t) { const s = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]]; t = Math.min(1, Math.max(0, t)) * 4; const i = Math.min(3, Math.floor(t)); const f = t - i; return [0,1,2].map(k => Math.round(s[i][k] + f * (s[i+1][k] - s[i][k]))); }
function slice(vol, axis, k) {   // index = i*N*N + j*N + l  (i = y1, j = y2, l = y3); returns an N x N uint8 array (rows = first remaining axis)
  const out = new Uint8Array(N * N);
  for (let p = 0; p < N; p++) for (let q = 0; q < N; q++) {
    const idx = axis === 0 ? k * N * N + p * N + q : axis === 1 ? p * N * N + k * N + q : p * N * N + q * N + k; out[p * N + q] = vol[idx]; }
  return out;
}
function draw(canvas, arr) {
  canvas.width = N; canvas.height = N; const ctx = canvas.getContext("2d"); const img = ctx.createImageData(N, N);
  for (let p = 0; p < N; p++) for (let q = 0; q < N; q++) { const c = viridis(arr[p * N + q] / 255); const o = 4 * ((N - 1 - q) * N + p); img.data[o] = c[0]; img.data[o+1] = c[1]; img.data[o+2] = c[2]; img.data[o+3] = 255; }
  ctx.putImageData(img, 0, 0);
}
function redraw() {
  if (!A) return; const vol = showRef && R ? R : U;
  for (let ax = 0; ax < 3; ax++) { const k = +$("s" + ax).value; $("s" + ax + "v").textContent = ((k + 0.5) / N).toFixed(2); draw($("a" + ax), slice(A, ax, k)); draw($("u" + ax), slice(vol, ax, k)); }
  $("ut").textContent = showRef && R ? "full solver: u" : "solution u";
}
function knobValues() { return Array.from(document.querySelectorAll("#knobs input")).map(e => (e.value / 1000).toFixed(3)); }
async function solve(withRef) {
  if (busy) { pending = true; return; } busy = true; const t0 = performance.now(); const pcg = $("pcg").value; $("pv").textContent = pcg;
  try {
    const r = await fetch(`${API}/api/vol3d/solve?x=${knobValues().join(",")}&ref=${withRef ? 1 : 0}&pcg=${pcg}`); const buf = await r.arrayBuffer(); N = +r.headers.get("X-N");
    const nn = N * N * N; A = new Uint8Array(buf, 16, nn); U = new Uint8Array(buf, 16 + nn, nn); R = withRef ? new Uint8Array(buf, 16 + 2 * nn + 8, nn) : null; showRef = withRef;
    for (let ax = 0; ax < 3; ax++) { $("s" + ax).max = N - 1; }
    redraw();
    let s = `surrogate: ${r.headers.get("X-Total-Ms")} ms on the server (${pcg} refinement steps)\nround trip: ${(performance.now() - t0).toFixed(0)} ms, ${(buf.byteLength / 1024).toFixed(0)} KB`;
    if (withRef) s += `\nfull solve: ${r.headers.get("X-Ref-Ms")} ms, relative L2 error of the surrogate: ${r.headers.get("X-Rel-L2")}  (showing the full solver's u; move a slider to go back)`;
    $("stat").textContent = s;
  } catch (e) { $("stat").textContent = "server not reachable: " + e; }
  busy = false; if (pending) { pending = false; solve(false); }
}
async function init() {
  info = await (await fetch(`${API}/api/vol3d/info`)).json(); N = info.N;
  for (let k = 0; k < info.knobs; k++) { const div = document.createElement("div"); div.className = "knob";
    div.innerHTML = `<label><span>mode ${k + 1}</span><span id="v${k}">0.000</span></label><input type="range" min="-1000" max="1000" value="0" data-k="${k}">`; $("knobs").appendChild(div); }
  document.querySelectorAll("#knobs input").forEach(e => e.addEventListener("input", () => { $("v" + e.dataset.k).textContent = (e.value / 1000).toFixed(3); solve(false); }));
  $("pcg").addEventListener("input", () => solve(false));
  for (let ax = 0; ax < 3; ax++) $("s" + ax).addEventListener("input", redraw);
  $("zero").onclick = () => { document.querySelectorAll("#knobs input").forEach(e => { e.value = 0; $("v" + e.dataset.k).textContent = "0.000"; }); solve(false); };
  $("rand").onclick = () => { document.querySelectorAll("#knobs input").forEach(e => { e.value = Math.round((Math.random() * 2 - 1) * 1000); $("v" + e.dataset.k).textContent = (e.value / 1000).toFixed(3); }); solve(false); };
  $("ref").onclick = () => solve(true);
  $("cell").textContent = `-div(exp(a) grad u) = 1 on the unit cube, u = 0 on the boundary, a = sum of ${info.d} sine modes with decaying amplitudes; the other ${info.d - info.knobs} modes are zero here.`;
  document.querySelectorAll("#knobs input")[0].value = 700; $("v0").textContent = "0.700"; solve(false);
}
init();
</script>
</body>
</html>
